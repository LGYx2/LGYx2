<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-label="nocap-cloud: free, open source and lightweight deployment panel for your own server">
  <style>
    .t{font:700 19px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace;fill:#22D3EE}
    .d{font:400 14px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace;fill:#8B949E}
    .s{font:500 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace;fill:#8B949E}
    .pulse{transform-origin:318px 121px;animation:pulse 1.8s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  </style>
  <rect x="1" y="1" width="458" height="148" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="22" y="40" class="t"><tspan fill="#8B949E">~/</tspan>nocap-cloud</text>
  <text x="22" y="74" class="d">Free, open source and lightweight</text>
  <text x="22" y="94" class="d">deployment panel for your own server.</text>
  <circle cx="28" cy="121" r="5" fill="#3178C6"/>
  <text x="40" y="126" class="s">TypeScript</text>
  <text x="150" y="126" class="s">open source</text>
  <circle cx="318" cy="121" r="5" fill="#22D3EE"/>
  <circle class="pulse" cx="318" cy="121" r="5" fill="#22D3EE"/>
  <text x="330" y="126" class="s">in development</text>
</svg>
