<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-label="nocap-cloud: free, open source and lightweight deployment panel for your own server">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <style>
    .t{font:700 20px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#6366F1}
    .d{font:400 14px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#64748B}
    .m{font:500 13px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#64748B}
    .card{opacity:0;animation:in .7s ease-out .1s forwards}
    .pulse{transform-origin:330px 121px;animation:pulse 1.8s ease-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
  </style>
  <g class="card">
    <rect x="1" y="1" width="458" height="148" rx="14" fill="#6366F1" fill-opacity="0.06" stroke="url(#edge)" stroke-width="1.5"/>
    <path transform="translate(22 24) scale(1.15)" fill="#8B5CF6" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    <text class="t" x="50" y="40">nocap-cloud</text>
    <text class="d" x="22" y="74">Free, open source and lightweight deployment</text>
    <text class="d" x="22" y="94">panel for your own server.</text>
    <circle cx="28" cy="121" r="6" fill="#3178C6"/>
    <text class="m" x="42" y="126">TypeScript</text>
    <text class="m" x="140" y="126">Open source</text>
    <circle cx="330" cy="121" r="5" fill="#8B5CF6"/>
    <circle class="pulse" cx="330" cy="121" r="5" fill="#8B5CF6"/>
    <text class="m" x="344" y="126">In development</text>
  </g>
</svg>
