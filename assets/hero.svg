    @keyframes g2{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(6px,-2px);opacity:.8}91%{transform:translate(-5px,1px);opacity:.8}94%{transform:translate(3px,0);opacity:.6}}
