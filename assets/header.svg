<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ismael Valgy, Backend and AI Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape">
      <path d="M0 0H1200V196C1080 236 960 238 820 214C680 190 560 168 420 192C280 216 140 240 0 206Z"/>
    </clipPath>
  </defs>
  <style>
    .title{font:700 60px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#FFFFFF;letter-spacing:-1px;opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .15s forwards}
    .sub{font:500 22px 'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;fill:#E0E7FF;letter-spacing:.5px;opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) .55s forwards}
    .w1{animation:drift 9s ease-in-out infinite alternate}
    .w2{animation:drift 13s ease-in-out infinite alternate-reverse}
    .orb{animation:float 6s ease-in-out infinite alternate}
    .orb2{animation:float 8s ease-in-out 1s infinite alternate-reverse}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-180px)}}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-14px)}}
  </style>
  <g clip-path="url(#shape)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <circle class="orb" cx="1030" cy="70" r="46" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle class="orb2" cx="150" cy="60" r="28" fill="#FFFFFF" fill-opacity="0.07"/>
    <path class="w1" d="M-200 170C-60 140 80 200 240 176S520 132 700 168S980 214 1160 170S1340 140 1500 168V260H-200Z" fill="#FFFFFF" fill-opacity="0.10"/>
    <path class="w2" d="M-200 196C-40 176 120 222 300 200S600 160 780 192S1080 236 1260 198S1420 184 1500 196V260H-200Z" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <text class="title" x="600" y="112" text-anchor="middle">Ismael Valgy</text>
  <text class="sub" x="600" y="154" text-anchor="middle">Backend &amp; AI Automation Engineer</text>
</svg>
